name: Build Miyoo package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Locate project files
        run: |
          ls -la
          P=$(find . -name package_onion.sh -not -path './.git/*' | head -1)
          echo "found: $P"
          if [ -z "$P" ]; then echo "package_onion.sh not found - upload is incomplete"; exit 1; fi
          D=$(dirname "$P")
          if [ "$D" != "." ]; then cp -r "$D"/. . ; fi
          ls -la
          ls src

      - name: Get Miyoo Mini toolchain
        run: git clone --depth 1 https://github.com/shauninman/union-miyoomini-toolchain /tmp/tc

      - name: Build toolchain image
        run: cd /tmp/tc && docker build -t miyoo-tc .

      - name: Compile game
        run: |
          docker run --rm -v "$PWD":/root/workspace/abobo miyoo-tc /bin/bash -c '
            cd /root/workspace/abobo || exit 1
            pwd
            ls -la
            ls src
            echo "CROSS_COMPILE=$CROSS_COMPILE"
            CC="${CROSS_COMPILE}gcc"
            $CC --version | head -1
            SRC="src/rt_core.c src/rt_interp.c src/rt_mc.c src/rt_render.c src/rt_builtins.c"
            $CC -O2 -w -DUSE_SDL1 -o abobo src/platform_sdl.c $SRC -lSDL -lSDL_mixer -lz -lm || $CC -O2 -w -o abobo src/platform_sdl.c $SRC $(sdl2-config --cflags --libs) -lSDL2_mixer -lz -lm
            ls -l abobo
          '

      - name: Package for Onion
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          chmod +x package_onion.sh
          ./package_onion.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AbobosBigAdventure
          path: AbobosBigAdventure
